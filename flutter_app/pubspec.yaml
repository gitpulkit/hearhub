name: hearhub
description: HearHub - Discover and use hearing support tools
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.6.2
  flutter_lucide: ^1.8.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/live_transcribe.png
    - assets/images/otter_ai.png
    - assets/images/caption_call.png
    - assets/images/roger_pen.png
    - assets/images/alertmaster.png
    - assets/images/hearing_loop_guide.png
    - assets/images/workplace_guide.png
